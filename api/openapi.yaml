    get:
      description: "Successful prompt-execution responses with truncated content (max\
        \ 10,000 chars). Pass `query` for case-insensitive full-text search inside\
        \ response texts: `total` becomes the exact count of matching responses and\
        \ each item returns `snippet` + `match_count` instead of `response`/`response_truncated`."
      operationId: listAnswers
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          type: string
        style: form
      - explode: true
