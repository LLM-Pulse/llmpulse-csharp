        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          description: Paginated shopping rows plus totals
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
