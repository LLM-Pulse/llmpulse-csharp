openapi: 3.0.3
info:
  contact:
    email: info@llmpulse.ai
    name: LLM Pulse Support
    url: https://llmpulse.ai
  description: REST API client for LLM Pulse AI visibility analytics.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  title: LLM Pulse API
  version: 1.22.0
servers:
- description: Production API
  url: https://api.llmpulse.ai/api/v1
security:
- BearerAuth: []
tags:
- description: API health check
  name: Health
- description: "Lists of projects, competitors, prompts, mentions, citations and other\
    \ dimensional entities"
  name: Dimensions
- description: "Aggregated time-series, summary, Share of Voice, top sources and agent-traffic\
    \ metrics"
  name: Metrics
- description: "Google Search Console performance data (impressions, clicks, CTR,\
    \ average position) for projects with a connected GSC property: headline totals,\
    \ time series, top queries and top pages. Growth plan and above."
  name: Search Console
- description: "Grouped cited-URL intelligence with page-cache metadata, mention evidence,\
    \ occurrences and sanitized cached content"
  name: Citation Intelligence
- description: "Aggregate AI Model Insights report endpoints (summary, position distribution,\
    \ AI Overview results)"
  name: AI Model Insights
- description: "Raw AI responses with mentions, citations, sentiments, sources, shopping\
    \ products, brand entities and local businesses"
  name: Answers
- description: Per-execution sentiment analysis records
  name: Sentiments
- description: Recommendation runs (the same data that powers the in-app Recommendations
    experience)
  name: Recommendations
- description: Bulk-create prompts
  name: Prompts
- description: Create and inspect GEO Writer (formerly Content Intelligence) tasks
  name: GEO Writer
- description: Model Context Protocol endpoint for AI clients
  name: MCP
- description: "Outbound webhook subscriptions: signed HTTP POST notifications for\
    \ project events (new mentions, citations, executions, negative sentiment, completed\
    \ reports). Scale plan and above."
  name: Webhooks
paths:
  /ping:
    get:
      description: "Validates the API key and optionally pings a project. Returns\
        \ the authenticated user_id, project (if project_id is supplied), and a request_id."
      operationId: ping
      parameters:
      - description: Optional project to verify access for
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ping_200_response"
          description: API is healthy
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: Missing Authorization header
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
      summary: Health check
      tags:
      - Health
  /metrics/timeseries:
    get:
      description: "Returns time-series data for one or more metrics, broken down\
        \ by actor (project + competitors). Supports day/week/month granularity, with\
        \ sticky carry-forward semantics for week/month aggregates."
      operationId: getTimeseries
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Comma-separated list of metrics: mentions, citations, responses,\
          \ mention_rate, visibility (alias for mention_rate), weighted_visibility,\
          \ ai_visibility_score (alias for weighted_visibility), citation_rate, avg_position,\
          \ avg_mention_position, net_sentiment, sentiment_very_positive, sentiment_positive,\
          \ sentiment_neutral, sentiment_negative, sentiment_very_negative. Citations\
          \ and citation_rate include visible citations and background source references;\
          \ avg_position uses visible citations only."
        explode: true
        in: query
        name: metrics
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          type: string
        style: form
      - explode: true
        in: query
        name: collection_id
        required: false
        schema:
          type: integer
        style: form
      - description: "ISO country code (e.g. US, GB, DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "ISO language code (e.g. en, es, de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by prompt type (search intent)
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          enum:
          - informational
          - navigational
          - commercial
          - transactional
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - explode: true
        in: query
        name: include_project
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeseriesResponse"
          description: Time-series data
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: Missing Authorization header
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: Project not found or not accessible
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: "Unknown metric: invalid_metric"
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Time-series metrics
      tags:
      - Metrics
  /metrics/summary:
    get:
      description: "Same as /metrics/timeseries but adds a `summary` block with total/min/max/last\
        \ per metric per actor, plus a `position_distribution` block (Position 1,\
        \ Position 2, Position 3+). Citations and citation rate include visible citations\
        \ and background source references. Background references use position 0 and\
        \ are excluded from avg_position and position distributions. `total` is a\
        \ SUM for count metrics (mentions, citations, responses) and an AVERAGE across\
        \ periods for rate/percentage and average metrics (visibility/mention_rate,\
        \ citation_rate, ai_visibility_score, sentiment shares, avg_position, avg_mention_position,\
        \ net_sentiment); rates are never summed. Each summary row carries an `aggregation`\
        \ field (`sum` or `average`)."
      operationId: getSummary
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Comma-separated list of metrics: mentions, citations, responses,\
          \ mention_rate, visibility (alias for mention_rate), weighted_visibility,\
          \ ai_visibility_score (alias for weighted_visibility), citation_rate, avg_position,\
          \ avg_mention_position, net_sentiment, sentiment_very_positive, sentiment_positive,\
          \ sentiment_neutral, sentiment_negative, sentiment_very_negative. Citations\
          \ and citation_rate include visible citations and background source references;\
          \ avg_position uses visible citations only."
        explode: true
        in: query
        name: metrics
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          type: string
        style: form
      - explode: true
        in: query
        name: collection_id
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by prompt type (search intent)
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          enum:
          - informational
          - navigational
          - commercial
          - transactional
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
          description: Summary metrics
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: Missing Authorization header
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: Project not found or not accessible
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
      summary: Aggregated metrics summary
      tags:
      - Metrics
  /metrics/prompt_summary:
    get:
      description: "Paginated per-prompt aggregated metrics. Returns responses, mentions,\
        \ citations, mention_rate, citation_rate, avg_mention_position and avg_position\
        \ per prompt. Citations and citation rate include visible citations and background\
        \ source references; avg_position uses visible citations only. Pass `breakdown=model`\
        \ to split each prompt by model."
      operationId: getPromptSummary
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Add per-(prompt, model) rows to the output"
        explode: true
        in: query
        name: breakdown
        required: false
        schema:
          enum:
          - model
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          type: string
        style: form
      - explode: true
        in: query
        name: collection_id
        required: false
        schema:
          type: integer
        style: form
      - description: "ISO country code (e.g. US, GB, DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "ISO language code (e.g. en, es, de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by prompt type (search intent)
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          enum:
          - informational
          - navigational
          - commercial
          - transactional
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: responses
          enum:
          - responses
          - mentions
          - citations
          - mention_rate
          - visibility
          - citation_rate
          - avg_mention_position
          - avg_position
          type: string
        style: form
      - explode: true
        in: query
        name: sort_dir
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSummaryResponse"
          description: Per-prompt metrics
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: Missing Authorization header
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
      summary: Per-prompt metrics summary
      tags:
      - Metrics
  /metrics/sov:
    get:
      description: "Share of Voice breakdown comparing your project to competitors.\
        \ Returns over_time, current snapshot, and a Top-4 + Others breakdown."
      operationId: getShareOfVoice
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          type: string
        style: form
      - explode: true
        in: query
        name: collection_id
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by prompt type (search intent)
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          enum:
          - informational
          - navigational
          - commercial
          - transactional
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      - description: "Which Share of Voice projection to flatten. Only valid together\
          \ with 'output'. 'over_time' (default) is one row per date and actor, 'current'\
          \ the ranked snapshot, 'breakdown' the Top 4 plus Others."
        explode: true
        in: query
        name: view
        required: false
        schema:
          default: over_time
          enum:
          - over_time
          - current
          - breakdown
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SovResponse"
          description: Share of voice data
      summary: Share of Voice
      tags:
      - Metrics
  /metrics/top_sources:
    get:
      description: "Registrable domains most frequently cited in AI responses for\
        \ the project, including visible citations and background source references.\
        \ This endpoint remains a domain rollup when exact-subdomain matching is enabled.\
        \ Results can be sorted by total responses, average mention rate, or average\
        \ visibility."
