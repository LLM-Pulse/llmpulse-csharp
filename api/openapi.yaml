      description: "Subscribes a public HTTPS URL to a project event. LLM Pulse POSTs\
        \ a JSON envelope (`event`, `occurred_at`, `project_id`, `subscription_id`,\
        \ `data`) to the URL every time the event occurs, signed via the `X-LLMPulse-Signature`\
        \ header (HMAC-SHA256 of the raw body computed with the subscription secret).\
        \ Failed deliveries receive up to 5 attempts in total, including the first,\
        \ with backoff; subscriptions auto-disable after 20 consecutive failed deliveries.\
        \ Idempotent for the same project + event + URL: re-posting returns the existing\
        \ subscription, unless the API key or OAuth connection that created it was\
        \ revoked; then it is replaced by a new subscription with a new secret. The\
        \ response carries `secret` when it creates the subscription, and on a re-post\
        \ only for the API key or OAuth connection that created it: any other credential\
        \ gets the subscription without `secret`. Requires a `read_write` scope API\
        \ key and the Scale plan or above."
      operationId: createWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createWebhook_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createWebhook_201_response"
          description: "Created, or the existing subscription on a re-post. The signing\
            \ secret is only returned by this endpoint, and on a re-post only to the\
            \ credential that created the subscription."
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_INSUFFICIENT_SCOPE
                  message: insufficient_scope_write_required
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: API key lacks write permission
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Create a webhook subscription
      tags:
      - Webhooks
      x-llms-description: "Subscribe a public HTTPS URL to a project event (new mention,\
        \ citation, execution, negative sentiment, completed report); deliveries are\
        \ HMAC-signed. Scale plan or above."
      x-mcp-tool: create_webhook_subscription
      x-plan: scale
      x-write: true
  /webhooks/{id}:
    delete:
      description: Deletes a webhook subscription; the target URL stops receiving
        events immediately. Requires a `read_write` scope API key and the Scale plan
        or above.
      operationId: deleteWebhook
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteWebhook_200_response"
          description: OK
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_INSUFFICIENT_SCOPE
