        \ they were sent and when they expire."
      x-mcp-tool: list_team_invitations
    post:
      description: "Invites someone to the account team with the same rules as the\
        \ Team Members settings page, and sends them the invitation email (email_sent\
        \ is false when the email provider refused it; the invitation still exists,\
        \ so revoke it and invite again once the address is fixed). Send project_ids,\
        \ or all_projects: true for every project (for a team member inviting, every\
        \ project they can access). The account owner and co-owners choose the access\
        \ with permission_role: full_access (default), view_only, custom (with permissions,\
        \ feature key to verbs) or account_role (with account_role_id). A team member\
        \ with permission to invite cannot choose access: leave those fields out and\
        \ the invitation copies their own permissions. Only the account owner can\
        \ set account_admin (co-owner) or billing_access. An address already registered\
        \ on the platform, or with an invitation pending, is refused with ERR_INVALID_PARAM\
        \ (revoke the pending one first). An account that cannot add more team members,\
        \ or that reached its daily limit of invitations sent through the API and\
        \ MCP (revoked ones count), answers ERR_LIMIT_REACHED; the message says which.\
        \ Requires a `read_write` scope API key."
