  /citation_intelligence/urls/{url_sha256}:
    get:
      description: "Unavailable page content keeps the cited URL and citation metrics.\
        \ Page metadata/content and unknown brand_mentioned/competitor_mentioned return\
        \ null. content_gap_status is content_unavailable (or missing_page_cache)\
        \ without usable content, and mentions_not_processed when the page has usable\
        \ content but its mention analysis has not completed for this project. Mention\
        \ fields (brand_mentioned, competitor_mentioned, brand_position, brands, mentions,\
        \ content_gap_status) describe the analysis for the requesting project: a\
        \ page not yet analyzed for it returns null (never false) brand_mentioned,\
        \ competitor_mentioned and brand_position, empty brands and mentions arrays\
        \ and page_cache.mentions_processed false. page_cache.mentions_processed is\
        \ true exactly when brand_mentioned is not null. An analyzed page keeps its\
        \ last result until a newer analysis replaces it. status_code shows a saved\
        \ successful response or observed 404/410; other crawl failures and error_message\
        \ are hidden. last_crawled_at dates the saved copy. Domain/host crawled_urls_count\
        \ counts usable copies; brand_mentioned_urls_count and competitor_mentioned_urls_count\
        \ count only URLs analyzed for the project and are null when none is."
      operationId: getCitedUrlDetail
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: 64-character hex SHA-256 of the cited URL
        explode: false
        in: path
        name: url_sha256
        required: true
        schema:
          pattern: "^[a-f0-9]{64}$"
          type: string
        style: simple
      responses:
        "200":
          description: URL-level intelligence
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
      summary: Cited URL detail
      tags:
      - Sources & Citation Intelligence
      x-llms-description: "Per-URL detail: counts, citation rate, page-cache metadata,\
        \ page mention evidence."
      x-mcp-tool: get_cited_url_details
