components:
  parameters:
    Output:
      description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
        \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
        \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are always\
        \ returned as JSON."
      explode: true
      in: query
      name: output
      required: false
      schema:
        enum:
        - flat
        - csv
        type: string
      style: form
    SovView:
      description: "Which Share of Voice projection to flatten. Only valid together\
        \ with 'output'. 'over_time' (default) is one row per date and actor, 'current'\
        \ the ranked snapshot, 'breakdown' the Top 4 plus Others."
      explode: true
      in: query
      name: view
      required: false
      schema:
        default: over_time
        enum:
        - over_time
        - current
        - breakdown
        type: string
      style: form
    ProjectId:
      description: Project ID
      explode: true
      in: query
      name: project_id
      required: true
      schema:
        type: integer
      style: form
    Competitors:
      description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
      explode: true
      in: query
      name: competitors
      required: false
      schema:
        type: string
      style: form
    Page:
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    PerPage:
      explode: true
      in: query
      name: per_page
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
      style: form
    Metrics:
      description: "Comma-separated list of metrics: mentions, citations, responses,\
        \ mention_rate, visibility (alias for mention_rate), weighted_visibility,\
        \ ai_visibility_score (alias for weighted_visibility), citation_rate, avg_position,\
        \ avg_mention_position, net_sentiment, sentiment_very_positive, sentiment_positive,\
        \ sentiment_neutral, sentiment_negative, sentiment_very_negative. Citations\
        \ and citation_rate include visible citations and background source references;\
        \ avg_position uses visible citations only."
      explode: true
      in: query
      name: metrics
      required: false
      schema:
        type: string
      style: form
    Granularity:
      explode: true
      in: query
      name: granularity
      required: false
      schema:
        enum:
        - day
        - week
        - month
        type: string
      style: form
    GscSearchType:
      description: "Which search surface to measure. Defaults to web. discover and\
        \ googleNews carry no query dimension, so Google rejects /search_console/queries\
        \ for them."
      explode: true
      in: query
      name: search_type
      required: false
      schema:
        default: web
        enum:
        - web
        - image
        - video
        - news
        - discover
        - googleNews
        type: string
      style: form
    GscFilters:
      description: "Narrow the query; every entry must match (AND). Send the whole\
        \ list as one JSON value: filters=[{\"dimension\":\"page\",\"operator\":\"\
        contains\",\"expression\":\"/blog/\"}] (URL-encoded). An array of objects\
        \ has no query-parameter form a generated client can produce, so the string\
        \ is what the official SDKs send; see the SearchConsoleFilters schema for\
        \ the shape it encodes. includingRegex and excludingRegex take RE2 syntax.\
        \ At most 10 entries, expression at most 500 characters. The bracket form\
        \ filters[][dimension]=page&filters[][operator]=contains&filters[][expression]=/blog/\
        \ is also accepted."
      example: "[{\"dimension\":\"page\",\"operator\":\"contains\",\"expression\"\
        :\"/blog/\"}]"
      explode: true
      in: query
      name: filters
      required: false
      schema:
        type: string
      style: form
    GscDataState:
      description: "final (default) counts only rows Google has finalized. all also\
        \ counts the most recent days, which are still being filled in and will change."
      explode: true
      in: query
      name: data_state
      required: false
      schema:
        default: final
        enum:
        - final
        - all
        type: string
      style: form
    Range:
      description: Number of days to look back (alternative to from/to)
      explode: true
      in: query
      name: range
      required: false
      schema:
        type: integer
      style: form
    From:
      explode: true
      in: query
      name: from
      required: false
      schema:
        format: date-time
        type: string
      style: form
    To:
      description: End of the window. A date-only value such as 2026-09-01 covers
        that whole day. Pass a full timestamp to end the window earlier.
      explode: true
      in: query
      name: to
      required: false
      schema:
        format: date-time
        type: string
      style: form
    Model:
      description: Filter by AI model. Models the API key's user has not enabled are
        silently dropped.
      explode: true
      in: query
      name: model
      required: false
      schema:
        enum:
        - chatgpt
        - perplexity
        - ai_mode
        - ai_overview
        - gemini
        - copilot
        - amazon_rufus
        - claude
        - grok
        - deepseek
        - naver_ai
        - baidu_ai
        - meta_ai
        type: string
      style: form
    CollectionId:
      description: "One collection/tag ID or a comma-separated list of IDs. A query\
        \ value is always a string on the wire, so it is typed as one: the previous\
        \ integer-or-string union made generators emit a wrapper type they could not\
        \ serialize."
      example: "12,34"
      explode: true
      in: query
      name: collection_id
      required: false
      schema:
        pattern: "^\\d+(,\\d+)*$"
        type: string
      style: form
    CountryCode:
      description: "One ISO country code or a comma-separated list (e.g. US,GB,DE)"
      explode: true
      in: query
      name: country_code
      required: false
      schema:
        type: string
      style: form
    LanguageCode:
      description: "One ISO language code or a comma-separated list (e.g. en,es,de)"
      explode: true
      in: query
      name: language_code
      required: false
      schema:
        type: string
      style: form
    Prompt:
      description: Filter by prompt ID
      explode: true
      in: query
      name: prompt
      required: false
      schema:
        type: integer
      style: form
    PromptType:
      description: "One prompt type or a comma-separated list: informational, navigational,\
        \ commercial, transactional"
      explode: true
      in: query
      name: prompt_type
      required: false
      schema:
        type: string
      style: form
    BrandKind:
      description: "Filter by brand kind: brand (own brand/products), brand_other\
        \ (competitors/other brands), non_brand (generic, no brand named). For fair\
        \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use non_brand:\
        \ brand-focused prompts skew results toward the brand they name. The in-app\
        \ Overview page applies non_brand by default."
      explode: true
      in: query
      name: brand_kind
      required: false
      schema:
        enum:
        - brand
        - brand_other
        - non_brand
        type: string
      style: form
    MentionFilter:
      description: "Filter by which brands are mentioned, as a two-axis matrix (your\
        \ brand x competitors): mentions_you / not_mentions_you, mentions_competitor\
        \ / not_mentions_competitor, and the four combined cells you_and_competitor,\
        \ competitor_not_you (a rival wins and you are absent), you_not_competitor,\
        \ no_brands (no tracked brand appears, i.e. open space). Combine with 'competitors'\
        \ to narrow the competitor side to specific rivals; on a negative cell that\
        \ reads 'none of these'. On /dimensions/sources it applies to the crawled\
        \ content of each cited page instead of the answer text. The legacy value\
        \ 'competitors_only' is still accepted as an alias of competitor_not_you."
      explode: true
      in: query
      name: mention_filter
      required: false
      schema:
        enum:
        - mentions_you
        - not_mentions_you
        - mentions_competitor
        - not_mentions_competitor
        - you_and_competitor
        - competitor_not_you
        - you_not_competitor
        - no_brands
        type: string
      style: form
    CitationFilter:
      description: Same two-axis matrix applied to the domains cited in the answer
        instead of the brands named in it. Independent of mention_filter; pass both
        to intersect them (e.g. mentions_you + not_cites_you finds answers that talk
        about you without linking to you).
      explode: true
      in: query
      name: citation_filter
      required: false
      schema:
        enum:
        - cites_you
        - not_cites_you
        - cites_competitor
        - not_cites_competitor
        - you_and_competitor
        - competitor_not_you
        - you_not_competitor
        - cites_no_brands
        type: string
      style: form
    IncludeProject:
      explode: true
      in: query
      name: include_project
      required: false
      schema:
        default: true
        type: boolean
      style: form
    UrlSha256:
      description: 64-character hex SHA-256 of the cited URL
      explode: false
      in: path
      name: url_sha256
      required: true
      schema:
        pattern: "^[a-f0-9]{64}$"
        type: string
      style: simple
