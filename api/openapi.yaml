  /answers:
    get:
      description: "Successful prompt-execution responses with truncated content (max\
        \ 10,000 chars). Pass `query` for case-insensitive full-text search inside\
        \ response texts: `total` becomes the exact count of matching responses and\
        \ each item returns `snippet` + `match_count` instead of `response`/`response_truncated`."
      operationId: listAnswers
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - ai_mode
          - ai_overview
          - gemini
          - copilot
          - amazon_rufus
          - claude
          - grok
          - deepseek
          - naver_ai
          - baidu_ai
          - meta_ai
          type: string
        style: form
      - description: "One collection/tag ID or a comma-separated list of IDs. A query\
          \ value is always a string on the wire, so it is typed as one: the previous\
          \ integer-or-string union made generators emit a wrapper type they could\
          \ not serialize."
        example: "12,34"
        explode: true
        in: query
        name: collection_id
        required: false
        schema:
          pattern: "^\\d+(,\\d+)*$"
          type: string
        style: form
      - description: "One ISO country code or a comma-separated list (e.g. US,GB,DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "One ISO language code or a comma-separated list (e.g. en,es,de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: "Filter by which brands are mentioned, as a two-axis matrix (your\
          \ brand x competitors): mentions_you / not_mentions_you, mentions_competitor\
          \ / not_mentions_competitor, and the four combined cells you_and_competitor,\
          \ competitor_not_you (a rival wins and you are absent), you_not_competitor,\
          \ no_brands (no tracked brand appears, i.e. open space). Combine with 'competitors'\
          \ to narrow the competitor side to specific rivals; on a negative cell that\
          \ reads 'none of these'. On /dimensions/sources it applies to the crawled\
          \ content of each cited page instead of the answer text. The legacy value\
          \ 'competitors_only' is still accepted as an alias of competitor_not_you."
        explode: true
        in: query
        name: mention_filter
        required: false
        schema:
          enum:
          - mentions_you
          - not_mentions_you
          - mentions_competitor
          - not_mentions_competitor
          - you_and_competitor
          - competitor_not_you
          - you_not_competitor
          - no_brands
          type: string
        style: form
      - description: Same two-axis matrix applied to the domains cited in the answer
          instead of the brands named in it. Independent of mention_filter; pass both
          to intersect them (e.g. mentions_you + not_cites_you finds answers that
          talk about you without linking to you).
        explode: true
        in: query
        name: citation_filter
        required: false
        schema:
          enum:
          - cites_you
          - not_cites_you
          - cites_competitor
          - not_cites_competitor
          - you_and_competitor
          - competitor_not_you
          - you_not_competitor
          - cites_no_brands
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Case-insensitive full-text search inside AI response texts. Switches
          items to snippet + match_count mode.
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - description: "Filter sentinel non-answers (provider returned nothing after\
          \ retries; excluded from platform metrics). false = only real answers, true\
          \ = only sentinels, omit = both. Every item carries its own no_result flag."
        explode: true
        in: query
        name: no_result
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          description: "Paginated answers. Every item carries app_url, the link that\
            \ opens the answer in the app"
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: List AI responses
      tags:
      - Answers
      x-llms-description: "Paginated AI responses with truncated content (10k chars),\
        \ counts, executed_at. query = full-text search (total becomes the exact match\
        \ count; rows return snippet + match_count)."
      x-mcp-tool: list_answers
