        explode: true
        in: query
        name: include_series
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: source_type
        required: false
        schema:
          enum:
