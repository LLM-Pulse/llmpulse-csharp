        required: true
        schema:
          enum:
          - shopify
          type: string
        style: form
      - description: "Store domain, with or without scheme, e.g. acme-store.com"
        explode: true
        in: query
        name: domain
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConnectionResponse"
          description: "Eligibility, the matching project and the candidates"
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_INTEGRATION_UNAVAILABLE
                  message: Store integrations are not available for white-label or
                    embed accounts
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "The account has a white-label portal or an embed, so store\
            \ integrations are not available (ERR_INTEGRATION_UNAVAILABLE). Writes\
            \ with a read-only key answer ERR_INSUFFICIENT_SCOPE, and a team member\
            \ without the permission ERR_INSUFFICIENT_PERMISSION, with the same status"
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Match a store to a project
      tags:
      - Store Integrations
      x-llms-description: "Store app setup: whether the account may use a store integration\
        \ and which project a store domain maps to, plus candidate projects. Not available\
        \ to white-label or embed accounts."
      x-rest-only: "Called by the store app (Shopify) to read its own connection,\
        \ not by agents."
  /ai_orders:
    get:
      description: "Reads back the AI-referred orders a store app pushed for a project:\
        \ totals, one row per AI assistant and a daily series of the days with orders.\
        \ Revenue values are decimal strings in currency. Team members need read access\
        \ to AI Traffic. Not available to accounts with a white-label portal or an\
        \ embed (ERR_INTEGRATION_UNAVAILABLE)."
      operationId: listAiOrders
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Store platform
        explode: true
        in: query
        name: platform
        required: false
        schema:
          default: shopify
          enum:
          - shopify
          type: string
        style: form
      - description: First day (YYYY-MM-DD). Defaults to 89 days before to
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Last day (YYYY-MM-DD). Defaults to today; the window is at most
          400 days
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiOrdersResponse"
          description: "Totals, per-assistant rows and the daily series"
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_INTEGRATION_UNAVAILABLE
                  message: Store integrations are not available for white-label or
                    embed accounts
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "The account has a white-label portal or an embed, so store\
            \ integrations are not available (ERR_INTEGRATION_UNAVAILABLE). Writes\
            \ with a read-only key answer ERR_INSUFFICIENT_SCOPE, and a team member\
            \ without the permission ERR_INSUFFICIENT_PERMISSION, with the same status"
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Read AI-referred store orders
      tags:
      - Store Integrations
      x-llms-description: "AI-referred store orders and revenue for a project: totals,\
        \ per AI assistant and a daily series (default last 90 days)."
      x-mcp-tool: get_ai_orders
      x-mcp-plan: growth
    put:
      description: "Replaces the daily AI-referred orders and revenue of the from..to\
        \ window. Send the raw referring host or utm_source of each order's first\
        \ visit as referrer: LLM Pulse classifies it and ignores anything that is\
        \ not an AI assistant. Entries for the same day and assistant are summed.\
        \ Every stored row of that project and platform inside the window is replaced,\
        \ so pushing the same window again converges instead of counting twice. Rows\
        \ are kept per project and platform, not per store, so one store reports per\
        \ project. Requires a `read_write` scope API key and, for team members, update\
        \ access to AI Traffic. Not available to accounts with a white-label portal\
        \ or an embed (ERR_INTEGRATION_UNAVAILABLE)."
      operationId: replaceAiOrders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiOrdersUpdateRequest"
