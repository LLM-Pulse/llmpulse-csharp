        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceTask"
          description: Task with result_data when completed
      summary: Get a GEO Writer task
      tags:
      - GEO Writer
      x-llms-description: Get one GEO Writer (formerly Content Intelligence) task
        with full result_data when completed (accepts numeric id or public_id).
      x-mcp-tool: get_intelligence_task
    patch:
      description: "Edits the text of a completed task in place. `edits` maps dotted\
        \ paths into result_data (for example `title` or `sections.0.content`) to\
        \ replacement text. Only string fields that already exist can change: a path\
        \ that does not resolve to text, a blank `title`, a value over 20,000 characters\
        \ or an empty `edits` object is rejected with ERR_INVALID_PARAM and nothing\
        \ is written. Send the `result_version` you last read with the edits: when\
        \ the task was regenerated since, the request is refused with ERR_STALE_CONTENT\
        \ (409), nothing is written and `error.meta.result_version` holds the current\
        \ token. Without `result_version` the edits apply to whatever the task holds\
        \ now. Values identical to the stored text are ignored, and the response lists\
        \ the paths that actually changed. The first edit keeps a copy of the generated\
        \ output so POST /intelligence_tasks/{id}/revert can restore it; regenerating\
        \ the task replaces the edited content. Requires a `read_write` scope API\
        \ key and, for team members, update permission on GEO Writer. On a product_listing\
        \ task, description_html keeps only p, ul, ol, li, strong, em, h3 and br,\
        \ with no attributes: other markup is stripped, not refused, so read the stored\
        \ value from the response. A revert restores the generated description cleaned\
        \ the same way."
