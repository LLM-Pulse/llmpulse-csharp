        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Return only this group of the chosen view: a domain (view=domain),\
          \ a host (view=host) or a cited URL exactly as listed (view=url). Domains\
          \ and hosts match case-insensitively, without www. A view=url key is one\
          \ raw URL, so its variants (a tracking parameter, a trailing slash) stay\
