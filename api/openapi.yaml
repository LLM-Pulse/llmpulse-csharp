      description: "Google Search Console property-wide series (impressions, clicks,\
        \ ctr, position) bucketed by day, week or month. Requires a connected Search\
        \ Console property (Growth+). X-Search-Console-Backend identifies stored or\
        \ live reads. Stored reads use synced data without contacting Google. Live\
