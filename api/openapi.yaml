  /citation_intelligence/groups:
    get:
      description: "Grouped citation intelligence by url / domain / host with per-model\
        \ breakdown, citation rate, and avg citation position. Counts and citation\
        \ rate include visible citations and background source references. Average\
        \ position ignores rows with position=0. Owned and competitor source matching\
        \ honor the project's exact-subdomain setting. Filter vocabulary aligns with\
        \ `source_type` returned by the API. Unavailable page content keeps the cited\
        \ URL and citation metrics. Page metadata/content and unknown brand_mentioned/competitor_mentioned\
        \ return null; content_gap_status is content_unavailable (or missing_page_cache).\
        \ Mention arrays stay empty until usable content has completed analysis. status_code\
        \ shows a saved successful response or observed 404/410; other crawl failures\
        \ and error_message are hidden. last_crawled_at dates the saved copy. Domain/host\
        \ crawled_urls_count counts usable copies; mention counts are null when no\
        \ URL has completed analysis."
      operationId: listCitationGroups
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: view
        required: false
        schema:
          default: url
          enum:
          - url
          - domain
          - host
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: order
        required: false
        schema:
          enum:
          - group_key
          - total_responses
          - total_citations
          - citation_rate
          - avg_citation_position
          - first_seen_at
          - last_seen_at
          type: string
        style: form
      - explode: true
        in: query
        name: direction
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          - naver_ai
          - baidu_ai
          type: string
        style: form
      - description: "One collection/tag ID or a comma-separated list of IDs. A query\
          \ value is always a string on the wire, so it is typed as one: the previous\
          \ integer-or-string union made generators emit a wrapper type they could\
          \ not serialize."
        example: "12,34"
        explode: true
        in: query
        name: collection_id
        required: false
        schema:
          pattern: "^\\d+(,\\d+)*$"
          type: string
        style: form
      - description: "One ISO country code or a comma-separated list (e.g. US,GB,DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "One ISO language code or a comma-separated list (e.g. en,es,de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
