  /search_console/summary:
    get:
      description: "Google Search Console headline totals (impressions, clicks, ctr\
        \ as a 0..1 fraction, average position) for the project over a date range.\
        \ Pass dimension=country, device, page, query or searchAppearance to also\
        \ receive the breakdown aggregated over the range, capped by limit. With filters\
        \ and no dimension, totals are the complete figure Google reports for that\
        \ filter. Breakdown rows are capped by limit and by Google's 25,000-row maximum;\
        \ breakdown_truncated: true means rows were left out. Query rows exclude anonymized\
        \ queries, and page and searchAppearance rows are counted per page rather\
        \ than per property, so breakdown rows can differ from the totals. Requires\
        \ the project to have a connected Search Console property and the Growth plan\
        \ or above; otherwise returns ERR_SEARCH_CONSOLE_NOT_CONNECTED or ERR_PLAN_REQUIRED.\
        \ X-Search-Console-Backend identifies stored or live reads. Stored reads use\
        \ synced data without contacting Google. Live reads return ERR_SEARCH_CONSOLE_ACCESS_REVOKED\
        \ (403) for revoked Google access; reconnect the property in Preferences >\
        \ Project Settings > Data Connections. They return ERR_SEARCH_CONSOLE_UPSTREAM\
        \ (503) when Google Search Console is unavailable or over quota; wait for\
        \ the number of seconds in Retry-After before retrying."
      operationId: getSearchConsoleSummary
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Number of days to look back, today included (alternative to\
          \ from/to). At most 487, Google's retention."
        explode: true
        in: query
        name: range
        required: false
        schema:
          maximum: 487
          minimum: 1
          type: integer
        style: form
      - description: Start date (YYYY-MM-DD). Defaults to 30 days ago.
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: "End date (YYYY-MM-DD), inclusive. Defaults to today. Google\
          \ publishes data with a 2-3 day lag, so data_through in the response says\
          \ how far it reaches."
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: "Optional breakdown aggregated over the range. country and device\
          \ are lowercased; page and query keep the casing Google returns, because\
          \ a page URL is case sensitive."
        explode: true
        in: query
        name: dimension
        required: false
        schema:
          enum:
          - country
          - device
          - page
          - query
          - searchAppearance
          type: string
        style: form
      - description: "Maximum breakdown rows, sorted by impressions descending. Default\
          \ and maximum 1000. Use /search_console/queries or /search_console/pages\
          \ to page through up to 25,000 rows."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: "Which search surface to measure. Defaults to web. discover and\
          \ googleNews carry no query dimension, so Google rejects /search_console/queries\
          \ for them."
        explode: true
        in: query
        name: search_type
        required: false
        schema:
          default: web
          enum:
          - web
          - image
          - video
          - news
          - discover
          - googleNews
          type: string
        style: form
      - description: "Narrow the query; every entry must match (AND). Send the whole\
          \ list as one JSON value: filters=[{\"dimension\":\"page\",\"operator\"\
          :\"contains\",\"expression\":\"/blog/\"}] (URL-encoded). An array of objects\
          \ has no query-parameter form a generated client can produce, so the string\
          \ is what the official SDKs send; see the SearchConsoleFilters schema for\
          \ the shape it encodes. includingRegex and excludingRegex take RE2 syntax.\
          \ At most 10 entries, expression at most 500 characters. The bracket form\
          \ filters[][dimension]=page&filters[][operator]=contains&filters[][expression]=/blog/\
          \ is also accepted."
        example: "[{\"dimension\":\"page\",\"operator\":\"contains\",\"expression\"\
          :\"/blog/\"}]"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: "final (default) counts only rows Google has finalized. all also\
          \ counts the most recent days, which are still being filled in and will\
          \ change."
        explode: true
        in: query
        name: data_state
        required: false
        schema:
          default: final
          enum:
          - final
          - all
          type: string
        style: form
      - description: "How Google counts impressions. auto (default) is what Search\
          \ Console shows (by page when page is grouped or filtered, else by property).\
          \ Google rejects byProperty with a page dimension or filter."
        explode: true
        in: query
        name: aggregation_type
        required: false
        schema:
          default: auto
          enum:
          - auto
          - byPage
          - byProperty
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchConsoleSummaryResponse"
          description: Search Console summary
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_SEARCH_CONSOLE_ACCESS_REVOKED
                  message: Google Search Console access was revoked. Reconnect the
                    property in Preferences > Project Settings > Data Connections.
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
