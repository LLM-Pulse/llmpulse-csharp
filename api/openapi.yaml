          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Case-insensitive full-text search inside AI response texts. Switches
          items to snippet + match_count mode.
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - description: "Filter sentinel non-answers (provider returned nothing after\
          \ retries; excluded from platform metrics). false = only real answers, true\
          \ = only sentinels, omit = both. Every item carries its own no_result flag."
        explode: true
        in: query
        name: no_result
        required: false
        schema:
          type: boolean
        style: form
