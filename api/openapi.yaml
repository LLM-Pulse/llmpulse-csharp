            \ own domain and covers its subdomains; a pasted URL is stored as its\
            \ domain (https://www.acme.co.uk/x becomes acme.co.uk). A list the domain\
            \ editor would refuse (a subdomain such as blog.acme.com, a platform many\
            \ companies share such as youtube.com, amazon.com or wordpress.com, the\
            \ project website, a tracked competitor domain, a duplicate or an entry\
            \ that is not a domain) is rejected with ERR_INVALID_PARAM and the reason.\
