    get:
      operationId: getIntelligenceTask
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Numeric task ID or public_id string token
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
