        \ identifies stored or live reads. Stored reads use synced data without contacting\
        \ Google. Live reads return ERR_SEARCH_CONSOLE_ACCESS_REVOKED (403) for revoked\
        \ Google access; reconnect the property in Preferences > Project Settings\
        \ > Data Connections. They return ERR_SEARCH_CONSOLE_UPSTREAM (503) when Google\
        \ Search Console is unavailable or over quota; wait for the number of seconds\
        \ in Retry-After before retrying."
      operationId: getSearchConsoleTimeseries
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Number of days to look back, today included (alternative to\
          \ from/to). At most 487, Google's retention."
        explode: true
        in: query
        name: range
        required: false
        schema:
          maximum: 487
          minimum: 1
          type: integer
        style: form
      - description: Start date (YYYY-MM-DD). Defaults to 30 days ago.
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: "End date (YYYY-MM-DD), inclusive. Defaults to today. Google\
          \ publishes data with a 2-3 day lag, so data_through in the response says\
          \ how far it reaches."
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
