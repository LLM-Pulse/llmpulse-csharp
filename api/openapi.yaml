  /dimensions/shopping:
    get:
      description: "Product cards returned inside AI answers. view=products (default)\
        \ returns one row per distinct product, merged across executions, with its\
        \ appearance count, price range, rating and whether it is yours, plus a currency_count\
        \ saying how many currencies it was priced in (above 1 means the row reports\
        \ its highest-priced listing and min_price may be another currency); view=merchants\
        \ returns one row per selling merchant, with a currency field naming the money\
        \ its price range and average are expressed in (providers price each market\
        \ in its own currency, so a merchant that sells in more than one reports the\
        \ currency most of its prices use). Every response also carries a totals block\
        \ matching the KPI cards in the app, whose avg_price is computed inside the\
        \ single currency named by avg_price_currency. Requires the Scale plan or\
        \ above."
      operationId: listShopping
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Row shape: one per distinct product, or one per merchant"
        explode: true
        in: query
        name: view
        required: false
        schema:
          default: products
          enum:
          - products
          - merchants
          type: string
        style: form
      - description: Return only products identified as the tracked brand's own. On
          view=merchants this narrows to the merchants selling those products; the
          totals block stays account-wide.
        explode: true
        in: query
        name: owned
        required: false
        schema:
          type: boolean
        style: form
      - description: Sort field; the allowed set depends on view
        explode: true
        in: query
        name: order
        required: false
        schema:
          enum:
          - appearances
          - price
          - rating
          - title
          - products
          - avg_price
          - avg_rating
          - merchant
          type: string
        style: form
      - explode: true
        in: query
        name: direction
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Case-insensitive substring filter on the product title
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - ai_mode
          - ai_overview
          - gemini
          - copilot
          - amazon_rufus
          - claude
          - grok
          - deepseek
          - naver_ai
          - baidu_ai
          - meta_ai
          type: string
        style: form
      - description: "One collection/tag ID or a comma-separated list of IDs. A query\
          \ value is always a string on the wire, so it is typed as one: the previous\
          \ integer-or-string union made generators emit a wrapper type they could\
          \ not serialize."
        example: "12,34"
        explode: true
        in: query
        name: collection_id
        required: false
        schema:
          pattern: "^\\d+(,\\d+)*$"
          type: string
        style: form
      - description: "One ISO country code or a comma-separated list (e.g. US,GB,DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "One ISO language code or a comma-separated list (e.g. en,es,de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: "One prompt type or a comma-separated list: informational, navigational,\
          \ commercial, transactional"
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
