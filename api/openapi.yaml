        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceTaskUpdateResponse"
          description: Updated task with the paths that changed
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_INSUFFICIENT_SCOPE
                  message: insufficient_scope_write_required
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: API key lacks write permission
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "409":
          content:
            application/json:
              example:
                error:
                  code: ERR_STALE_CONTENT
                  message: The task was regenerated since it was read; its current
                    result_version is 1775642580. Read it again and resend your edits.
                  meta:
                    message: The task was regenerated since it was read; its current
                      result_version is 1775642580. Read it again and resend your
                      edits.
                    result_version: "1775642580"
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: The task was regenerated since the result_version in the request
            was read (ERR_STALE_CONTENT). Nothing was written; error.meta.result_version
            holds the current token. Read the task again and resend the edits
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
