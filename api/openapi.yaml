          - total_citations
          - citation_rate
          - avg_citation_position
          - first_seen_at
          - last_seen_at
          type: string
        style: form
      - explode: true
        in: query
        name: direction
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Filter by one AI model. Only chatgpt, ai_overview, ai_mode,\
          \ perplexity, gemini, naver_ai and baidu_ai are accepted: any other value,\
          \ including another model enabled for the API key's user, returns 422 ERR_INVALID_PARAM\
          \ (invalid model). One of those seven that the user has not enabled also\
          \ returns 422 ERR_INVALID_PARAM, with the valid values in the message."
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
