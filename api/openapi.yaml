        name: collection_id
        required: false
        schema:
          type: integer
        style: form
      - description: "ISO country code (e.g. US, GB, DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "ISO language code (e.g. en, es, de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: "Filter by which brands are mentioned, as a two-axis matrix (your\
          \ brand x competitors): mentions_you / not_mentions_you, mentions_competitor\
          \ / not_mentions_competitor, and the four combined cells you_and_competitor,\
          \ competitor_not_you (a rival wins and you are absent), you_not_competitor,\
          \ no_brands (no tracked brand appears, i.e. open space). Combine with 'competitors'\
          \ to narrow the competitor side to specific rivals; on a negative cell that\
          \ reads 'none of these'. On /dimensions/sources it applies to the crawled\
          \ content of each cited page instead of the answer text. The legacy value\
          \ 'competitors_only' is still accepted as an alias of competitor_not_you."
        explode: true
        in: query
        name: mention_filter
        required: false
        schema:
          enum:
          - mentions_you
          - not_mentions_you
          - mentions_competitor
          - not_mentions_competitor
          - you_and_competitor
          - competitor_not_you
          - you_not_competitor
          - no_brands
          type: string
        style: form
      - description: Same two-axis matrix applied to the domains cited in the answer
          instead of the brands named in it. Independent of mention_filter; pass both
          to intersect them (e.g. mentions_you + not_cites_you finds answers that
          talk about you without linking to you).
        explode: true
        in: query
        name: citation_filter
        required: false
        schema:
          enum:
          - cites_you
          - not_cites_you
          - cites_competitor
          - not_cites_competitor
          - you_and_competitor
          - competitor_not_you
          - you_not_competitor
          - cites_no_brands
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Case-insensitive full-text search inside AI response texts. Switches
          items to snippet + match_count mode.
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Paginated answers
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: "Unknown metric: invalid_metric"
