        \ the store domain, else one whose domain is a parent or a subdomain of it,\
        \ else null. candidates lists every live project of the account so the app\
        \ can offer a picker. Takes no project_id. Not available to accounts with\
        \ a white-label portal or an embed (ERR_INTEGRATION_UNAVAILABLE)."
      operationId: getStoreConnection
      parameters:
      - description: Store platform
        explode: true
        in: query
