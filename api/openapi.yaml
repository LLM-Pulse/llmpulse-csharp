          - competitor
          - third_party
          - social_media
          - own_domain
          - ugc
          - background
          type: string
        style: form
      - explode: true
        in: query
        name: sentiment
        required: false
        schema:
          enum:
          - negative
          type: string
        style: form
      - description: "mentioned: the cited page mentions your brand. gap: it mentions\
