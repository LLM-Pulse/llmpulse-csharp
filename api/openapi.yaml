        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: recommendation_type
        required: false
        schema:
          enum:
          - ai_visibility
          - social_community
          - brand_building
          - sentiment_reputation
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - processing
          - completed
          - failed
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"
          description: Paginated recommendations
      summary: List recommendation runs
      tags:
      - Recommendations
      x-llms-description: List recommendation runs for a project (filter by recommendation_type
        and status).
      x-mcp-tool: list_recommendations
    post:
      description: "Launches a full-scope recommendations generation (async job, 1-3\
        \ minutes; poll GET /recommendations/{id} until status is completed). Consumes\
        \ the project weekly recommendation-item budget: returns ERR_LIMIT_REACHED\
        \ when it is exhausted or when a generation of the same type is already pending/processing.\
        \ sentiment_reputation requires the Scale plan or above. Requires a `read_write`\
        \ scope API key."
      operationId: launchRecommendations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/launchRecommendations_request"
        required: true
      responses:
        "201":
          description: Generation launched (status pending)
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_INSUFFICIENT_SCOPE
                  message: insufficient_scope_write_required
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: API key lacks write permission
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Launch a recommendations generation
      tags:
      - Recommendations
      x-llms-description: "Launch a new recommendations generation (async, 1-3 min;\
        \ consumes the weekly recommendation budget). Poll GET /recommendations/:id."
      x-mcp-tool: launch_recommendations
      x-write: true
