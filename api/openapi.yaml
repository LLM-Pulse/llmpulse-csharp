              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Replace AI-referred store orders for a window
      tags:
      - Store Integrations
      x-llms-description: Replace the daily AI-referred orders and revenue a store
        app reports for a window; raw referrers are classified and non-AI ones ignored.
