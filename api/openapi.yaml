              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
      summary: Cited URL cached content
      tags:
      - Sources & Citation Intelligence
      x-llms-description: Sanitized cached page content for a cited URL plus mention
        evidence.
      x-mcp-tool: get_cited_url_content
