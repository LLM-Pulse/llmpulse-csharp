        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Comma-separated dimensions to group by, 1 to 3 of date, country,\
          \ device, page, query, searchAppearance. Each becomes a field of every row;\
          \ country and device values are lowercase."
        example: "page,query"
        explode: true
        in: query
        name: dimensions
        required: true
        schema:
          type: string
        style: form
      - description: "Number of days to look back, today included (alternative to\
          \ from/to). At most 487, Google's retention."
        explode: true
        in: query
        name: range
        required: false
        schema:
          maximum: 487
          minimum: 1
          type: integer
        style: form
      - description: Start date (YYYY-MM-DD). Defaults to 30 days ago.
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: "End date (YYYY-MM-DD), inclusive. Defaults to today. Google\
          \ publishes data with a 2-3 day lag, so data_through in the response says\
          \ how far it reaches."
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: impressions
          enum:
          - impressions
          - clicks
          - ctr
          - position
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Google ranks rows by clicks and returns at most 25,000 per request.\
          \ start_row moves that window down the ranking (e.g. 25000 for the next\
          \ block); sort and pagination apply within the window."
        explode: true
        in: query
        name: start_row
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      - description: "Which search surface to measure. Defaults to web. discover and\
          \ googleNews carry no query dimension, so Google rejects /search_console/queries\
          \ for them."
        explode: true
        in: query
        name: search_type
        required: false
        schema:
          default: web
          enum:
          - web
          - image
          - video
          - news
          - discover
          - googleNews
          type: string
        style: form
      - description: "Narrow the query; every entry must match (AND). Send the whole\
          \ list as one JSON value: filters=[{\"dimension\":\"page\",\"operator\"\
          :\"contains\",\"expression\":\"/blog/\"}] (URL-encoded). An array of objects\
          \ has no query-parameter form a generated client can produce, so the string\
          \ is what the official SDKs send; see the SearchConsoleFilters schema for\
          \ the shape it encodes. includingRegex and excludingRegex take RE2 syntax.\
          \ At most 10 entries, expression at most 500 characters. The bracket form\
          \ filters[][dimension]=page&filters[][operator]=contains&filters[][expression]=/blog/\
          \ is also accepted."
        example: "[{\"dimension\":\"page\",\"operator\":\"contains\",\"expression\"\
          :\"/blog/\"}]"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: "final (default) counts only rows Google has finalized. all also\
          \ counts the most recent days, which are still being filled in and will\
          \ change."
        explode: true
        in: query
        name: data_state
        required: false
        schema:
          default: final
          enum:
          - final
          - all
          type: string
        style: form
      - description: "How Google counts impressions. auto (default) is what Search\
          \ Console shows (by page when page is grouped or filtered, else by property).\
          \ Google rejects byProperty with a page dimension or filter."
        explode: true
        in: query
        name: aggregation_type
        required: false
        schema:
          default: auto
          enum:
          - auto
          - byPage
          - byProperty
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchConsoleRowsResponse"
          description: Search Console rows
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_SEARCH_CONSOLE_ACCESS_REVOKED
                  message: Google Search Console access was revoked. Reconnect the
                    property in Preferences > Project Settings > Data Connections.
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Plan below Growth (ERR_PLAN_REQUIRED), or Google revoked the\
            \ project's Search Console access (ERR_SEARCH_CONSOLE_ACCESS_REVOKED):\
            \ reconnect the property"
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
        "503":
          content:
            application/json:
              example:
                error:
                  code: ERR_SEARCH_CONSOLE_UPSTREAM
                  message: Google Search Console is temporarily unavailable. Retry
                    in a few minutes.
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Upstream provider unavailable, retry after the number of seconds\
            \ in the Retry-After header: Google's own value when it sent one, otherwise\
            \ 900 after a quota error and 60 after an outage"
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              explode: false
              schema:
                type: integer
              style: simple
      summary: Search Console rows by several dimensions (Growth+)
      tags:
      - Search Console
      x-llms-description: "Google Search Console rows grouped by up to 3 dimensions\
        \ (e.g. page and query, or date and page), ranked by impressions/clicks/CTR/position,\
        \ paginated; at most 25,000 rows per request, start_row reads the next block\
        \ (Growth+)."
      x-mcp-tool: get_search_console_rows
      x-plan: growth
