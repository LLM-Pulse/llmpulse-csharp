  /search_console/summary:
    get:
      description: "Google Search Console headline totals (impressions, clicks, ctr\
        \ as a 0..1 fraction, average position) for the project over a date range.\
        \ Pass dimension=country, device, page, query or searchAppearance to also\
        \ receive the breakdown aggregated over the range, capped by limit. Requires\
        \ the project to have a connected Search Console property and the Growth plan\
        \ or above; otherwise returns ERR_SEARCH_CONSOLE_NOT_CONNECTED or ERR_PLAN_REQUIRED.\
        \ X-Search-Console-Backend identifies stored or live reads. Stored reads use\
        \ synced data without contacting Google. Live reads return ERR_SEARCH_CONSOLE_ACCESS_REVOKED\
        \ (403) for revoked Google access; reconnect the property in Preferences >\
        \ Project Settings > Data Connections. They return ERR_SEARCH_CONSOLE_UPSTREAM\
        \ (503) when Google Search Console is unavailable or over quota; wait for\
        \ the number of seconds in Retry-After before retrying."
      operationId: getSearchConsoleSummary
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Optional breakdown aggregated over the range. country and device\
          \ are lowercased; page and query keep the casing Google returns, because\
          \ a page URL is case sensitive."
        explode: true
        in: query
        name: dimension
        required: false
        schema:
          enum:
          - country
          - device
          - page
          - query
          - searchAppearance
          type: string
        style: form
      - description: "Maximum breakdown rows, sorted by impressions descending. Default\
          \ and maximum 1000. Use /search_console/queries or /search_console/pages\
          \ to page through a full list."
        explode: true
        in: query
        name: limit
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: "Which search surface to measure. Defaults to web. discover and\
          \ googleNews carry no query dimension, so Google rejects /search_console/queries\
          \ for them."
        explode: true
        in: query
        name: search_type
        required: false
        schema:
          default: web
          enum:
          - web
          - image
          - video
          - news
          - discover
          - googleNews
          type: string
        style: form
      - description: "Narrow the query; every entry must match (AND). Send the whole\
          \ list as one JSON value: filters=[{\"dimension\":\"page\",\"operator\"\
          :\"contains\",\"expression\":\"/blog/\"}] (URL-encoded). An array of objects\
          \ has no query-parameter form a generated client can produce, so the string\
          \ is what the official SDKs send; see the SearchConsoleFilters schema for\
          \ the shape it encodes. includingRegex and excludingRegex take RE2 syntax.\
          \ At most 10 entries, expression at most 500 characters. The bracket form\
          \ filters[][dimension]=page&filters[][operator]=contains&filters[][expression]=/blog/\
          \ is also accepted."
        example: "[{\"dimension\":\"page\",\"operator\":\"contains\",\"expression\"\
          :\"/blog/\"}]"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      - description: "final (default) counts only rows Google has finalized. all also\
          \ counts the most recent days, which are still being filled in and will\
          \ change."
        explode: true
        in: query
        name: data_state
        required: false
        schema:
          default: final
          enum:
          - final
          - all
          type: string
        style: form
      responses:
        "200":
          description: Search Console summary
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_SEARCH_CONSOLE_ACCESS_REVOKED
                  message: Google Search Console access was revoked. Reconnect the
                    property in Preferences > Project Settings > Data Connections.
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Plan below Growth (ERR_PLAN_REQUIRED), or Google revoked the\
            \ project's Search Console access (ERR_SEARCH_CONSOLE_ACCESS_REVOKED):\
            \ reconnect the property"
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "503":
          content:
            application/json:
              example:
                error:
                  code: ERR_SEARCH_CONSOLE_UPSTREAM
                  message: Google Search Console is temporarily unavailable. Retry
                    in a few minutes.
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Upstream provider unavailable, retry after the number of seconds\
            \ in the Retry-After header"
          headers:
            Retry-After:
              description: "Seconds to wait before retrying: Google's own value when\
                \ it sent one, otherwise 900 after a quota error and 60 after an outage"
              explode: false
              schema:
                type: integer
              style: simple
      summary: Search Console summary (Growth+)
      tags:
      - Search Console
      x-llms-description: "Google Search Console headline totals (impressions, clicks,\
        \ CTR, average position) for a date range, with optional country/device breakdown.\
        \ Requires a connected GSC property (Growth+)."
      x-mcp-tool: get_search_console_summary
      x-plan: growth
