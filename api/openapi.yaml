        explode: true
        in: query
        name: content_gap
        required: false
        schema:
          enum:
          - mentioned
          - gap
          type: string
        style: form
      responses:
        "200":
          description: Grouped citation intelligence
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Grouped citation intelligence
      tags:
      - Sources & Citation Intelligence
      x-llms-description: Grouped citation intelligence by URL / domain / host with
        filters and per-model breakdown; key reads one group and include_series adds
        its citations per period.
      x-mcp-tool: list_citation_groups
