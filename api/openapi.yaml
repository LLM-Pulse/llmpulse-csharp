  /web_analytics/schema:
    get:
      description: "How to query the web analytics provider connected to the project,\
        \ live: the provider, the property every query runs on, the native query format\
        \ it accepts, the allowed top-level fields, the rules the bridge enforces\
        \ (the connected property is always used, only reads run, row limits), a worked\
        \ example and, where the provider offers it, its live field list. Cached for\
        \ an hour. Supported providers: Google Analytics 4, Adobe Analytics or Customer\
        \ Journey Analytics, Matomo, PostHog, Plausible and Piano, connected on the\
        \ AI Traffic page. Requires the Growth plan or above; otherwise ERR_PLAN_REQUIRED.\
        \ Without a connected provider returns ERR_WEB_ANALYTICS_NOT_CONNECTED (404);\
        \ a provider that refuses the stored credentials returns ERR_WEB_ANALYTICS_ACCESS_REVOKED\
        \ (403); an unavailable provider, an exhausted provider quota, more than 20\
        \ uncached queries a minute or too many running at once for the project returns\
        \ ERR_WEB_ANALYTICS_UPSTREAM (503): wait for the number of seconds in Retry-After\
        \ before retrying."
      operationId: getWebAnalyticsSchema
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAnalyticsSchemaResponse"
          description: Query format for the connected provider
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_REVOKED_API_KEY
                  message: revoked_api_key
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Access forbidden
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "503":
          content:
            application/json:
              example:
                error:
                  code: ERR_SEARCH_CONSOLE_UPSTREAM
                  message: Google Search Console is temporarily unavailable. Retry
                    in a few minutes.
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Upstream provider unavailable, retry after the number of seconds\
            \ in the Retry-After header: Google's own value when it sent one, otherwise\
            \ 900 after a quota error and 60 after an outage"
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              explode: false
              schema:
                type: integer
              style: simple
      summary: Web analytics query format (Growth+)
      tags:
      - AI & Agent Traffic
      x-llms-description: "How to query the connected web analytics provider live:\
        \ its native query format, enforced rules, an example and its live field list\
        \ (Growth+)."
      x-mcp-tool: get_web_analytics_schema
      x-plan: growth
  /web_analytics/query:
    post:
      description: "Runs a read-only query, written in the connected provider's native\
        \ format, against the project's property and returns columns and rows: a GA4\
        \ Data API runReport body, an Adobe Analytics or Customer Journey Analytics\
        \ report request, Matomo Reporting API parameters (get methods only), PostHog\
        \ HogQL, a Plausible Stats API v2 query or a Piano getData body. The connected\
        \ property, site, report suite or project is always used and any property\
        \ field in the query is ignored. Rows default to 100 and are capped at 5,000.\
        \ Identical queries are answered from a 10-minute cache (cached: true). A\
        \ query the provider rejects returns ERR_WEB_ANALYTICS_INVALID_QUERY (422)\
        \ with the provider's own validation message. Each uncached query spends the\
        \ customer's provider API quota. A read: no writable key is needed. Supported\
        \ providers: Google Analytics 4, Adobe Analytics or Customer Journey Analytics,\
        \ Matomo, PostHog, Plausible and Piano, connected on the AI Traffic page.\
        \ Requires the Growth plan or above; otherwise ERR_PLAN_REQUIRED. Without\
        \ a connected provider returns ERR_WEB_ANALYTICS_NOT_CONNECTED (404); a provider\
        \ that refuses the stored credentials returns ERR_WEB_ANALYTICS_ACCESS_REVOKED\
        \ (403); an unavailable provider, an exhausted provider quota, more than 20\
        \ uncached queries a minute or too many running at once for the project returns\
        \ ERR_WEB_ANALYTICS_UPSTREAM (503): wait for the number of seconds in Retry-After\
        \ before retrying."
      operationId: queryWebAnalytics
      requestBody:
        content:
          application/json:
            example:
              project_id: 123
              query:
                dateRanges:
                - startDate: 28daysAgo
                  endDate: yesterday
                dimensions:
                - name: sessionDefaultChannelGroup
                metrics:
                - name: sessions
                - name: keyEvents
                limit: 20
            schema:
              $ref: "#/components/schemas/queryWebAnalytics_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAnalyticsQueryResponse"
          description: Query result as columns and rows
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_REVOKED_API_KEY
                  message: revoked_api_key
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Access forbidden
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
        "503":
          content:
            application/json:
              example:
                error:
                  code: ERR_SEARCH_CONSOLE_UPSTREAM
                  message: Google Search Console is temporarily unavailable. Retry
                    in a few minutes.
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Upstream provider unavailable, retry after the number of seconds\
            \ in the Retry-After header: Google's own value when it sent one, otherwise\
            \ 900 after a quota error and 60 after an outage"
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              explode: false
              schema:
                type: integer
              style: simple
      summary: Live web analytics query (Growth+)
      tags:
      - AI & Agent Traffic
      x-llms-description: "Live, read-only query in the provider's native format (GA4\
        \ runReport, Adobe report, Matomo API, PostHog HogQL, Plausible v2, Piano\
        \ getData) on the connected property; columns and rows (Growth+)."
      x-mcp-tool: query_web_analytics
      x-plan: growth
  /dimensions/agent_bots:
    get:
      description: "Static catalog of AI bots that Agent Analytics can identify. Useful\
        \ for rendering filter UIs that mirror our internal classification (slug,\
        \ display name, company, category, Cloudflare verified-bot mapping, description).\
        \ Requires the Scale plan; lower tiers receive ERR_PLAN_REQUIRED. The equivalent\
        \ MCP tool list_agent_bots is available on the Scale plan or above."
      operationId: listAgentBots
      parameters:
      - description: "Accepted for compatibility and ignored. The catalog is the same\
          \ for every project, so any value returns the same list and the project\
          \ is not checked."
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBotsResponse"
          description: Bot catalog
        "403":
          content:
            application/json:
              example:
                error:
                  code: ERR_PLAN_REQUIRED
                  message: Scale plan or above required
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Endpoint requires a higher plan tier
