    post:
      description: "Starts a suggestion run with one of the generators behind the\
        \ app's Add prompts wizards and answers 202 with the run. website writes suggestions\
        \ from the scraped website (80% non-brand, 20% brand; up to 100 per project,\
        \ then ERR_LIMIT_REACHED), keyword from a keyword or the project profile (optionally\
        \ around a competitor), topic from a topic, reddit from Reddit discussions\
        \ of a topic or brand, paa from Google People Also Ask (up to 5 keywords,\
        \ counted against the account's 24-hour lookup allowance), reputational from\
        \ brand reputation questions, translate from the project's prompts of another\
        \ locale, search_console from the connected property's top queries of the\
        \ last 28 days (Growth plan or above, ERR_PLAN_REQUIRED). The suggestions\
        \ land in the Suggested prompts queue; poll GET /prompt_generations/{id},\
        \ then accept the ones you want with POST /suggested_prompts/accept. Nothing\
        \ is tracked until accepted. The request is validated before the run starts,\
        \ and refused with ERR_LIMIT_REACHED when the plan has no prompt slot left,\
        \ or ERR_QUOTA_EXCEEDED after 60 runs in an hour (the per-user prompt suggestion\
        \ allowance, shared with project setup). Requires a `read_write` scope API\
        \ key and, for team members, create access to Prompts."
