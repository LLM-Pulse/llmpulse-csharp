  /webhooks/sample/{event_type}:
    get:
      description: "Returns up to 3 example event payloads for the event type, built\
        \ from the project's most recent real data (or a static sample when the project\
        \ has no data). Used by integration editors such as the Zapier sample loader.\
        \ Requires the Scale plan or above."
      operationId: sampleWebhookPayloads
      parameters:
      - explode: false
        in: path
