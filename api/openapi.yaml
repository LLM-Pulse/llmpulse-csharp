openapi: 3.0.3
info:
  contact:
    email: info@llmpulse.ai
    name: LLM Pulse Support
    url: https://llmpulse.ai
  description: REST API client for LLM Pulse AI visibility analytics.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  title: LLM Pulse API
  version: 1.46.0
servers:
- description: Production API
  url: https://api.llmpulse.ai/api/v1
security:
- BearerAuth: []
tags:
- description: "Health check that validates an API key and, optionally, access to\
    \ a project."
  name: Health
- description: "Plan, subscription window, quota consumption and API rate limits for\
    \ the authenticated account. Read it before spending quota so an integration can\
    \ see its remaining budget instead of discovering the ceiling by hitting it."
  name: Account
- description: "A project is one tracked brand. List and read projects, see which\
    \ AI models and locales have data, create a project in one call, or drive the\
    \ multi-step draft wizard."
  name: Projects
- description: "Aggregated visibility, share of voice, citation and position data\
    \ for the project and its competitors: time series, period summary, per-prompt\
    \ summary, Share of Voice and top cited sources."
  name: Metrics
- description: The brands tracked alongside your own. Competitor ids are the actor_id
    values the metrics endpoints report against.
  name: Competitors
- description: "The questions executed against the AI models every week, and the execution\
    \ records each run produces."
  name: Prompts
- description: "Collections (labelled Tags in the app) group prompts by topic, funnel\
    \ stage or campaign so metrics can be filtered by them."
  name: Collections & Tags
- description: "The AI responses behind every metric, with their full text, mentions,\
    \ citations and sentiment analysis."
  name: Answers
- description: "The raw records behind the visibility metrics: one row per brand mention\
    \ or per cited URL, for the project brand, for competitors, or for both in a single\
    \ stream."
  name: Mentions & Citations
- description: "Sentiment records with their comments, topics and scores, plus the\
    \ category catalog used to label them."
  name: Sentiments
- description: "Every URL extracted from AI responses, plus grouped URL, domain and\
    \ host views, page-cache metadata, mention evidence inside cited pages, occurrences\
    \ and sanitized cached content."
  name: Sources & Citation Intelligence
- description: "Aggregate AI Model Insights report endpoints (summary, position distribution,\
    \ AI Overview results). All filter by executed_at and share a standard actor shape."
  name: AI Model Insights
- description: "What AI sends to your site: referral traffic from AI assistants measured\
    \ by the connected web analytics provider, and AI crawler traffic hitting your\
    \ origin server. Scale plan and above."
  name: AI & Agent Traffic
- description: "Commercial surfaces inside AI answers: the product cards models return\
    \ and the paid placements that run alongside them, with the merchants and advertisers\
    \ behind each. Scale plan and above."
  name: Shopping & Ads
- description: "Which of your own channels and which community conversations AI answers\
    \ cite: YouTube, Instagram, Facebook, TikTok, LinkedIn, app-store listings and\
    \ Reddit. Growth plan and above."
  name: Owned Media & Communities
- description: "Multi-model analyst reports: the monthly reputation scoring of your\
    \ brand against its competitors, and the custom AI studies you define over any\
    \ subjects and dimensions. Requires reputation monitoring."
  name: Reputation & Studies
- description: "Google Search Console performance data (impressions, clicks, CTR,\
    \ average position) for projects with a connected GSC property: headline totals,\
    \ time series, top queries and top pages. Growth plan and above."
  name: Search Console
- description: "Recommendation runs that power the in-app Recommendations page, plus\
    \ the endpoint that launches a new one."
  name: Recommendations
- description: "AI-powered GEO Writer tasks (formerly Content Intelligence). Tasks\
    \ are processed asynchronously, so create one and poll it until it completes."
  name: GEO Writer
- description: "Run the technical GEO analysis bundle, then list, poll and retrieve\
    \ each completed report."
  name: Technical GEO Reports
- description: "Mark a date on the project timeline (a campaign launch, a site migration)\
    \ so charts show what happened when."
  name: Annotations
- description: "Outbound event notifications: subscribe an HTTPS URL to project events\
    \ and receive HMAC-signed deliveries with no polling. Scale plan and above."
  name: Webhooks
- description: "Model Context Protocol endpoint for AI clients (Claude, ChatGPT, Cursor\
    \ and other MCP-compatible assistants)."
  name: MCP
- description: "OAuth 2.1 authorization for MCP clients: discovery metadata, dynamic\
    \ client registration, authorization, token exchange and JWKS."
  name: OAuth 2.1
paths:
  /ping:
    get:
      description: "Validates the API key and optionally pings a project. Returns\
        \ the authenticated user_id, project (if project_id is supplied), and a request_id."
      operationId: ping
      parameters:
      - description: Optional project to verify access for
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ping_200_response"
          description: API is healthy
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
      summary: Health check
      tags:
      - Health
  /account:
    get:
      description: "Returns the account plan, tracking cadence, subscription window,\
        \ how much of each quota is used (prompts, projects, competitors per project,\
        \ monthly GEO Writer tasks, team members) and the published API rate limits.\
        \ Limits resolve through the account owner, so a team member sees the capacity\
        \ that applies to them. An unlimited quota returns limit and remaining as\
        \ null with unlimited set to true, since Infinity is not representable in\
        \ JSON. The subscription block is only present for callers who can access\
        \ Billing and Plans in the app (the account owner, or a team member with billing\
        \ access); everyone else gets the same response without that key. requests_per_minute\
        \ is the ceiling of the key used for the call, not a fixed number."
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccount_200_response"
          description: Account usage snapshot
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
      summary: "Account plan, quota usage and rate limits"
      tags:
      - Account
  /metrics/timeseries:
    get:
      description: "Returns time-series data for one or more metrics, broken down\
        \ by actor (project + competitors). Supports day/week/month granularity, with\
        \ sticky carry-forward semantics for week/month aggregates."
      operationId: getTimeseries
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Comma-separated list of metrics: mentions, citations, responses,\
          \ mention_rate, visibility (alias for mention_rate), weighted_visibility,\
          \ ai_visibility_score (alias for weighted_visibility), citation_rate, avg_position,\
          \ avg_mention_position, net_sentiment, sentiment_very_positive, sentiment_positive,\
          \ sentiment_neutral, sentiment_negative, sentiment_very_negative. Citations\
          \ and citation_rate include visible citations and background source references;\
          \ avg_position uses visible citations only."
        explode: true
        in: query
        name: metrics
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          - naver_ai
          - baidu_ai
          type: string
        style: form
      - description: "One collection/tag ID or a comma-separated list of IDs. A query\
          \ value is always a string on the wire, so it is typed as one: the previous\
          \ integer-or-string union made generators emit a wrapper type they could\
          \ not serialize."
        example: "12,34"
        explode: true
        in: query
        name: collection_id
        required: false
        schema:
          pattern: "^\\d+(,\\d+)*$"
          type: string
        style: form
      - description: "One ISO country code or a comma-separated list (e.g. US,GB,DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "One ISO language code or a comma-separated list (e.g. en,es,de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: "One prompt type or a comma-separated list: informational, navigational,\
          \ commercial, transactional"
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - explode: true
        in: query
        name: include_project
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeseriesResponse"
          description: Time-series data
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              example:
                error:
                  code: ERR_INVALID_PARAM
                  message: invalid metrics
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid parameters
      summary: Time-series metrics
      tags:
      - Metrics
  /metrics/summary:
    get:
      description: "Same as /metrics/timeseries but adds a `summary` block with total/min/max/last\
        \ per metric per actor, plus a `position_distribution` block (Position 1,\
        \ Position 2, Position 3+). Citations and citation rate include visible citations\
        \ and background source references. Background references use position 0 and\
        \ are excluded from avg_position and position distributions. `total` is a\
        \ SUM for count metrics (mentions, citations, responses) and an AVERAGE across\
        \ periods for rate/percentage and average metrics (visibility/mention_rate,\
        \ citation_rate, ai_visibility_score, sentiment shares, avg_position, avg_mention_position,\
        \ net_sentiment); rates are never summed. Each summary row carries an `aggregation`\
        \ field (`sum` or `average`)."
      operationId: getSummary
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: "Comma-separated list of metrics: mentions, citations, responses,\
          \ mention_rate, visibility (alias for mention_rate), weighted_visibility,\
          \ ai_visibility_score (alias for weighted_visibility), citation_rate, avg_position,\
          \ avg_mention_position, net_sentiment, sentiment_very_positive, sentiment_positive,\
          \ sentiment_neutral, sentiment_negative, sentiment_very_negative. Citations\
          \ and citation_rate include visible citations and background source references;\
          \ avg_position uses visible citations only."
        explode: true
        in: query
        name: metrics
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          - naver_ai
          - baidu_ai
          type: string
        style: form
      - description: "One collection/tag ID or a comma-separated list of IDs. A query\
          \ value is always a string on the wire, so it is typed as one: the previous\
          \ integer-or-string union made generators emit a wrapper type they could\
          \ not serialize."
        example: "12,34"
        explode: true
        in: query
        name: collection_id
        required: false
        schema:
          pattern: "^\\d+(,\\d+)*$"
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: "One prompt type or a comma-separated list: informational, navigational,\
          \ commercial, transactional"
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
          description: Summary metrics
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
        "404":
          content:
            application/json:
              example:
                error:
                  code: ERR_PROJECT_NOT_FOUND
                  message: project_not_found
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
      summary: Aggregated metrics summary
      tags:
      - Metrics
  /metrics/prompt_summary:
    get:
      description: "Paginated per-prompt aggregated metrics. Returns responses, mentions,\
        \ citations, mention_rate, citation_rate, avg_mention_position and avg_position\
        \ per prompt. Citations and citation rate include visible citations and background\
        \ source references; avg_position uses visible citations only. Pass `breakdown=model`\
        \ to split each prompt by model."
      operationId: getPromptSummary
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Add per-(prompt, model) rows to the output"
        explode: true
        in: query
        name: breakdown
        required: false
        schema:
          enum:
          - model
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          - naver_ai
          - baidu_ai
          type: string
        style: form
      - description: "One collection/tag ID or a comma-separated list of IDs. A query\
          \ value is always a string on the wire, so it is typed as one: the previous\
          \ integer-or-string union made generators emit a wrapper type they could\
          \ not serialize."
        example: "12,34"
        explode: true
        in: query
        name: collection_id
        required: false
        schema:
          pattern: "^\\d+(,\\d+)*$"
          type: string
        style: form
      - description: "One ISO country code or a comma-separated list (e.g. US,GB,DE)"
        explode: true
        in: query
        name: country_code
        required: false
        schema:
          type: string
        style: form
      - description: "One ISO language code or a comma-separated list (e.g. en,es,de)"
        explode: true
        in: query
        name: language_code
        required: false
        schema:
          type: string
        style: form
      - description: Filter by prompt ID
        explode: true
        in: query
        name: prompt
        required: false
        schema:
          type: integer
        style: form
      - description: "One prompt type or a comma-separated list: informational, navigational,\
          \ commercial, transactional"
        explode: true
        in: query
        name: prompt_type
        required: false
        schema:
          type: string
        style: form
      - description: "Filter by brand kind: brand (own brand/products), brand_other\
          \ (competitors/other brands), non_brand (generic, no brand named). For fair\
          \ 1:1 brand-vs-competitor comparisons (visibility, share of voice), use\
          \ non_brand: brand-focused prompts skew results toward the brand they name.\
          \ The in-app Overview page applies non_brand by default."
        explode: true
        in: query
        name: brand_kind
        required: false
        schema:
          enum:
          - brand
          - brand_other
          - non_brand
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: responses
          enum:
          - responses
          - mentions
          - citations
          - mention_rate
          - visibility
          - citation_rate
          - avg_mention_position
          - avg_position
          type: string
        style: form
      - explode: true
        in: query
        name: sort_dir
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Rectangular output for BI tools (Tableau, Excel, Sheets, ELT).\
          \ Omit for the default nested JSON. 'flat' returns the same metadata plus\
          \ 'columns' and 'rows'; 'csv' returns those rows as text/csv. Errors are\
          \ always returned as JSON."
        explode: true
        in: query
        name: output
        required: false
        schema:
          enum:
          - flat
          - csv
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSummaryResponse"
          description: Per-prompt metrics
        "401":
          content:
            application/json:
              example:
                error:
                  code: ERR_MISSING_AUTH
                  message: missing_authorization
                request_id: abc-123
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failed
      summary: Per-prompt metrics summary
      tags:
      - Metrics
  /metrics/sov:
    get:
      description: "Share of Voice breakdown comparing your project to competitors.\
        \ Returns over_time, current snapshot, and a Top-4 + Others breakdown."
      operationId: getShareOfVoice
      parameters:
      - description: Project ID
        explode: true
        in: query
        name: project_id
        required: true
        schema:
          type: integer
        style: form
      - description: Number of days to look back (alternative to from/to)
        explode: true
        in: query
        name: range
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End of the window. A date-only value such as 2026-09-01 covers
          that whole day. Pass a full timestamp to end the window earlier.
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
        style: form
      - description: Comma-separated competitor IDs (unknown IDs return ERR_INVALID_PARAM)
        explode: true
        in: query
        name: competitors
        required: false
        schema:
          type: string
        style: form
      - description: Filter by AI model. Models the API key's user has not enabled
          are silently dropped.
        explode: true
        in: query
        name: model
        required: false
        schema:
          enum:
          - chatgpt
          - perplexity
          - gemini
          - ai_overview
          - ai_mode
          - copilot
          - claude
          - grok
          - deepseek
          - meta_ai
          - amazon_rufus
          - naver_ai
          - baidu_ai
